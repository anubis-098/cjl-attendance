services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cj_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cj_local_change_me}
      POSTGRES_DB: postgres
    volumes:
      - cj_sql_data:/var/lib/postgresql/data
      - ./sql/001-databases.sql:/docker-entrypoint-initdb.d/001-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cj_app -d employee_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    image: cj-attendance-web:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    init: true
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PGHOST: database
      PGPORT: "5432"
      PGUSER: cj_app
      PGPASSWORD: ${POSTGRES_PASSWORD:-cj_local_change_me}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  cj_sql_data:
